<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Carter Pour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
/* Pour filter: camera full screen, a Carter soda bottle, hold to pour, stop on the line. */
:root{
  --bg:#f3f2ee; --surface:#ffffff; --ink:#151515; --muted:#8b8a85; --line:#dddcd6;
  --accent:#3355ff; --accent-ink:#ffffff; --good:#14a35a; --bad:#e2483d; --low:#ff8a1f;
  --f:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--f);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:none}
body.cam video{display:block}
canvas{display:block;position:fixed;inset:0;touch-action:none}

.hud{position:fixed;top:max(16px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
body.cam .hud{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55)}
.score{font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.lbl{margin-top:4px;font-size:13px;font-weight:500}
.right{font-size:13px;text-align:right;line-height:1.5}
.big{font-size:28px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.right b{font-weight:500;font-variant-numeric:tabular-nums}

.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(3px);transition:opacity .25s}
.overlay[hidden]{display:grid;opacity:0;pointer-events:none}
.card{width:min(340px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px 24px 22px;text-align:center}
.face{width:96px;height:96px;border-radius:50%;object-fit:cover;object-position:50% 40%;border:3px solid var(--ink);display:block;margin:0 auto 14px}
h1{margin:0;font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1}
.sub{margin:6px 0 0;color:var(--muted);font-size:14px}
.result{margin:16px 0 0;font-size:15px}
.result b{font-size:28px;display:block;font-variant-numeric:tabular-nums}
.how{list-style:none;padding:0;margin:18px 0 0;font-size:14px;line-height:1.7;color:var(--muted)}
.how b{color:var(--ink);font-weight:500}
.play{margin-top:20px;width:100%;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:700 17px var(--f);padding:14px;cursor:pointer}
.play:active{transform:scale(.98)}
.err{margin-top:10px;font-size:13px;color:var(--bad)}
.back{display:inline-block;margin-top:14px;font-size:13px;font-weight:500;color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<canvas id="c"></canvas>

<div class="hud">
  <div><div class="score" id="total">0</div><div class="lbl">points</div></div>
  <div class="right"><div class="big" id="cup">1/10</div>cups<br>best <b id="best">–</b></div>
</div>

<div class="overlay" id="overlay">
  <div class="card">
    <img class="face" src="carter.jpg" alt="Carter">
    <h1 id="title">Carter Pour</h1>
    <p class="sub" id="sub">10 cups. Fill each one exactly to the line.</p>
    <p class="result" id="result" hidden></p>
    <ul class="how" id="how">
      <li><b>Hold</b> to tip the Carter soda, <b>let go</b> to stop</li>
      <li>Drink still in the air keeps falling, so stop early</li>
      <li>Weird cups fill at weird speeds. Overflow = 0</li>
    </ul>
    <button class="play" id="play">Allow camera</button>
    <div class="err" id="err" hidden></div>
    <a class="back" href="./">← all filters</a>
  </div>
</div>

<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const FONT = '"Space Grotesk",system-ui,sans-serif';
const CUPS = 10;
const AUTO = location.hash === '#auto', SIM = AUTO || location.hash === '#sim';   // test hooks: autopilot / fixed-step sim

// cup shapes: half-width (0..1 of max) as a function of height y (0 = bottom, 1 = rim)
const SHAPES = [
  { name: 'Tall glass',  r: y => 0.62 + 0.08 * y },
  { name: 'Party cup',   r: y => 0.62 + 0.3 * y },
  { name: 'Cone',        r: y => 0.12 + 0.88 * y },
  { name: 'Flask',       r: y => y < 0.55 ? 0.95 - 0.1 * y : Math.max(0.24, 0.9 - (y - 0.55) * 1.6) },
  { name: 'Bowl',        r: y => 0.35 + 0.65 * Math.sqrt(y) },
  { name: 'Hourglass',   r: y => 0.3 + 0.6 * Math.abs(y - 0.5) * 2 },
  { name: 'Skinny tube', r: y => 0.34 },
  { name: 'Vase',        r: y => 0.55 + 0.4 * Math.sin(y * Math.PI) },
];
const DRINKS = [
  { name: 'cola',   c: '#5b2a12', foam: '#e9d8c4' },
  { name: 'orange', c: '#ff8a1f', foam: '#ffe2bd' },
  { name: 'lime',   c: '#7bcf3a', foam: '#e8f8d5' },
  { name: 'grape',  c: '#7a3cc8', foam: '#e6d7fb' },
  { name: 'berry',  c: '#e2483d', foam: '#ffd9d5' },
  { name: 'blue',   c: '#2a8cff', foam: '#d8ebff' },
];
const pick = a => a[Math.floor(Math.random() * a.length)];

let W = 0, H = 0, DPR = 1, C = {};
let cupBox = { x: 0, y: 0, w: 0, h: 0 }, bottle = { x: 0, y: 0, len: 0 };
function readColors(){
  const cs = getComputedStyle(document.documentElement);
  for (const k of ['ink','muted','good','bad','accent','low']) C[k] = cs.getPropertyValue('--' + k).trim();
}
function resize(){
  DPR = Math.min(devicePixelRatio || 1, 1.5); W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  readColors();
  const ch = Math.min(H * 0.36, 340), cw = Math.min(W * 0.6, ch * 0.95);
  cupBox = { x: W / 2, y: H * 0.88, w: cw, h: ch };          // x = centre, y = bottom of the cup
  bottle.len = Math.min(H * 0.2, 170);
  bottle.tip = TILT_MAX;
  bottle.y = cupBox.y - ch - H * 0.2;                        // pivot height
  bottle.x = W / 2 - Math.sin(TILT_MAX) * bottle.len * 0.62; // so the mouth sits over the cup when fully tipped
}
const TILT_MAX = 1.95;

const face = new Image(); face.src = 'carter.jpg';

// ---------- volume maths: round cup, so volume ~ integral of r(y)^2 ----------
const STEPS = 240;
let volTable = [];
function buildVolume(shape){
  volTable = [0];
  let v = 0;
  for (let i = 1; i <= STEPS; i++){ const y = (i - 0.5) / STEPS, r = shape.r(y); v += r * r / STEPS; volTable.push(v); }
  const tot = v; volTable = volTable.map(x => x / tot);       // normalise: 1 = full to the rim
}
function levelFromVol(v){
  if (v <= 0) return 0;
  if (v >= 1) return 1;
  let lo = 0, hi = STEPS;
  while (hi - lo > 1){ const m = (lo + hi) >> 1; if (volTable[m] < v) lo = m; else hi = m; }
  const a = volTable[lo], b = volTable[hi];
  return (lo + (v - a) / (b - a || 1)) / STEPS;
}

// ---------- audio: soft fizz while pouring, a ding or a splash when judged ----------
let actx, fizz = null;
function audio(){ try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} return actx; }
function fizzOn(on){
  const a = audio(); if (!a) return;
  try {
    if (on && !fizz){
      const len = a.sampleRate, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = a.createBufferSource(); src.buffer = buf; src.loop = true;
      const f = a.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 2500;
      const g = a.createGain(); g.gain.value = 0.0; g.gain.linearRampToValueAtTime(0.12, a.currentTime + 0.1);
      src.connect(f); f.connect(g); g.connect(a.destination); src.start();
      fizz = { src, g };
    } else if (!on && fizz){
      const { src, g } = fizz; fizz = null;
      g.gain.cancelScheduledValues(a.currentTime); g.gain.setValueAtTime(g.gain.value, a.currentTime);
      g.gain.linearRampToValueAtTime(0, a.currentTime + 0.25); src.stop(a.currentTime + 0.3);
    }
  } catch (e) {}
}
function ding(score){
  const a = audio(); if (!a) return;
  try {
    const now = a.currentTime, notes = score >= 95 ? [880, 1320, 1760] : score >= 70 ? [660, 990] : score > 0 ? [440] : [180, 120];
    notes.forEach((f, i) => {
      const o = a.createOscillator(), g = a.createGain();
      o.type = score > 0 ? 'triangle' : 'sawtooth'; o.frequency.value = f;
      g.gain.setValueAtTime(0, now + i * 0.08); g.gain.linearRampToValueAtTime(0.25, now + i * 0.08 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.35);
      o.connect(g); g.connect(a.destination); o.start(now + i * 0.08); o.stop(now + i * 0.08 + 0.4);
    });
  } catch (e) {}
}

// ---------- state ----------
let state = 'menu', t = 0, cupN = 0, total = 0, scores = [];
let shape, drink, target = 0.7, vol = 0, level = 0, tilt = 0, holding = false, used = false;
let inflight = [], judged = false, judgeT = 0, spill = false, wob = 0;
let bubbles = [], drops = [], pops = [], confetti = [];
let best = 0;
try { best = +localStorage.getItem('carterpour.best') || 0; } catch (e) {}
$('best').textContent = best || '–';

const shown = {};
function setText(id, txt){ if (shown[id] !== txt){ shown[id] = txt; $(id).textContent = txt; } }

function reset(){
  cupN = 0; total = 0; scores = []; pops = []; confetti = [];
  setText('total', '0');
  nextCup();
}
function nextCup(){
  // first cup is always a plain tall glass; the rest get weirder
  shape = cupN === 0 ? SHAPES[0] : pick(SHAPES.slice(1));
  drink = pick(DRINKS);
  buildVolume(shape);
  target = 0.55 + Math.random() * 0.3;
  vol = 0; level = 0; tilt = 0; holding = false; used = false; inflight = []; judged = false; judgeT = 0; spill = false;
  bubbles = []; drops = [];
  setText('cup', `${cupN + 1}/${CUPS}`);
}
// volume per second at full tilt: about 2.6 s to fill an empty cup at the start, 1.7 s by the last cup
const flowRate = () => 1 / (2.6 - cupN * 0.1);
const fallTime = () => Math.max(0.12, (cupBox.y - cupBox.h * level - mouth().y) / (H * 1.6));

function mouth(){
  const a = tilt, L = bottle.len * 0.62;
  return { x: bottle.x + Math.sin(a) * L, y: bottle.y - Math.cos(a) * L };
}

function press(){ if (state === 'play' && !used && !judged){ holding = true; } }
function release(){ if (holding){ holding = false; used = true; } }

function judge(){
  judged = true; fizzOn(false);
  const err = Math.abs(level - target) * 100;   // in % of cup height
  const score = spill ? 0 : Math.max(0, Math.round(100 - err * 5));   // within ~1% of the cup height = PERFECT
  scores.push(score); total += score; setText('total', String(total));
  const txt = spill ? pick(['SPILL!', 'Carter got soaked', 'overflow!']) : score >= 95 ? 'PERFECT' : score >= 80 ? 'great' : score >= 50 ? 'ok' : score > 0 ? 'meh' : (level < target ? 'way too little' : 'way too much');
  pops.push({ t: 0, txt: `${txt} +${score}`, good: score >= 50 });
  ding(score);
  if (navigator.vibrate && navigator.userActivation && navigator.userActivation.hasBeenActive) try { navigator.vibrate(score >= 95 ? [20, 40, 20] : 25); } catch (e) {}
  judgeT = 0;
}

function update(dt){
  t += dt;
  wob = Math.max(0, wob - dt * 2);
  for (const p of pops) p.t += dt;
  pops = pops.filter(p => p.t < 1.4);
  for (const c of confetti){ c.x += c.vx * dt; c.y += c.vy * dt; c.vy += 900 * dt; c.r += c.vr * dt; }
  confetti = confetti.filter(c => c.y < H + 40);
  for (const d of drops){ d.vy += 1500 * dt; d.x += d.vx * dt; d.y += d.vy * dt; }
  drops = drops.filter(d => d.y < H + 20);
  const surfY = cupBox.y - cupBox.h * level;
  for (const b of bubbles){ b.y -= b.v * dt; b.x += Math.sin(t * 6 + b.p) * 6 * dt; }
  bubbles = bubbles.filter(b => b.y > surfY + 2);

  if (state !== 'play') return;

  // bottle tips while you hold, rights itself when you let go
  tilt += ((holding ? TILT_MAX : 0) - tilt) * Math.min(1, dt * (holding ? 7 : 9));
  const flowing = tilt > 1.25;
  if (flowing) fizzOn(true);
  // emitted drink takes a moment to fall: queue it and land it later
  const emit = flowing ? flowRate() * Math.min(1, (tilt - 1.25) / 0.6) * dt : 0;
  if (emit > 0) inflight.push({ age: 0, v: emit });
  let landed = 0;
  const ft = fallTime();
  for (const q of inflight){ q.age += dt; if (q.age >= ft){ landed += q.v; q.v = 0; } }
  inflight = inflight.filter(q => q.v > 0);
  if (landed > 0){
    vol += landed; wob = Math.min(1, wob + landed * 8);
    if (Math.random() < 0.8) bubbles.push({ x: cupBox.x + (Math.random() - .5) * cupBox.w * 0.3, y: cupBox.y - 4, v: 60 + Math.random() * 80, p: Math.random() * 6, r: 1 + Math.random() * 2.5 });
  }
  if (vol >= 1){
    // overflow: the extra runs down the sides
    if (!spill){ spill = true; wob = 1; }
    const extra = vol - 1; vol = 1;
    if (extra > 0) for (let i = 0; i < 3; i++){
      const side = Math.random() < .5 ? -1 : 1;
      drops.push({ x: cupBox.x + side * cupBox.w / 2 * shape.r(1), y: cupBox.y - cupBox.h, vx: side * (40 + Math.random() * 80), vy: -60, c: drink.c });
    }
  }
  level = levelFromVol(vol);
  if (!flowing && !holding) fizzOn(inflight.length > 0);

  // judge once you've let go, the bottle is upright and nothing is still falling
  if (used && !judged && !holding && tilt < 0.3 && inflight.length === 0){ judgeT += dt; if (judgeT > 0.35) judge(); }
  if (judged){
    judgeT += dt;
    if (judgeT > 1.3){
      cupN++;
      if (cupN >= CUPS) return end();
      nextCup();
    }
  }
}

function end(){
  state = 'over'; fizzOn(false);
  const newBest = total > best;
  if (newBest){ best = total; try { localStorage.setItem('carterpour.best', String(best)); } catch (e) {} $('best').textContent = best; }
  if (total >= 700) for (let i = 0; i < 150; i++) confetti.push({ x: W / 2 + (Math.random() - .5) * W * .4, y: H * .45, vx: (Math.random() - .5) * 900,
    vy: -300 - Math.random() * 700, r: Math.random() * 6, vr: (Math.random() - .5) * 14, c: pick(DRINKS).c });
  const perfect = scores.filter(s => s >= 95).length, spills = scores.filter(s => s === 0).length;
  setTimeout(() => {
    $('title').textContent = newBest ? 'New best!' : total >= 900 ? 'Master pourer' : total >= 600 ? 'Nice pouring' : 'Sticky floor';
    $('sub').textContent = total >= 900 ? "Carter's favourite bartender." : `${perfect} perfect pour${perfect === 1 ? '' : 's'}, ${spills} zero${spills === 1 ? '' : 's'}.`;
    $('result').hidden = false;
    $('result').innerHTML = `<b>${total}/1000</b>points`;
    $('how').hidden = true;
    $('play').textContent = 'Again';
    $('overlay').hidden = false;
  }, 700);
}

// ---------- drawing ----------
function cupPath(maxY){
  // outline of the inside of the cup from the bottom up to height maxY (0..1)
  const { x, y, w, h } = cupBox, n = 40, pts = [];
  for (let i = 0; i <= n; i++){ const yy = maxY * i / n; pts.push([x + w / 2 * shape.r(yy), y - h * yy]); }
  for (let i = n; i >= 0; i--){ const yy = maxY * i / n; pts.push([x - w / 2 * shape.r(yy), y - h * yy]); }
  return pts;
}
function drawCup(){
  const { x, y, w, h } = cupBox;
  // glass body
  const outline = cupPath(1);
  ctx.beginPath(); outline.forEach(([a, b], i) => i ? ctx.lineTo(a, b) : ctx.moveTo(a, b)); ctx.closePath();
  ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.fill();

  // liquid with a wobbly surface
  if (level > 0.002){
    ctx.save();
    ctx.beginPath(); outline.forEach(([a, b], i) => i ? ctx.lineTo(a, b) : ctx.moveTo(a, b)); ctx.closePath(); ctx.clip();
    const sy = y - h * level, half = w / 2 * shape.r(level) + 4, amp = 2 + wob * 6;
    ctx.beginPath(); ctx.moveTo(x - half, y + 2);
    for (let i = 0; i <= 24; i++){ const xx = x - half + 2 * half * i / 24; ctx.lineTo(xx, sy + Math.sin(t * 9 + i * 0.7) * amp * Math.sin(Math.PI * i / 24)); }
    ctx.lineTo(x + half, y + 2); ctx.closePath();
    const g = ctx.createLinearGradient(0, sy, 0, y); g.addColorStop(0, drink.c); g.addColorStop(1, shade(drink.c, -0.25));
    ctx.fillStyle = g; ctx.fill();
    // foam
    ctx.fillStyle = drink.foam; ctx.globalAlpha = 0.85;
    ctx.beginPath();
    for (let i = 0; i <= 24; i++){ const xx = x - half + 2 * half * i / 24; ctx.lineTo(xx, sy - 3 + Math.sin(t * 9 + i * 0.7) * amp * Math.sin(Math.PI * i / 24)); }
    for (let i = 24; i >= 0; i--){ const xx = x - half + 2 * half * i / 24; ctx.lineTo(xx, sy + 5 + Math.sin(t * 9 + i * 0.7) * amp * Math.sin(Math.PI * i / 24)); }
    ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    for (const b of bubbles){ ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  }

  // glass edges + shine
  ctx.beginPath(); outline.forEach(([a, b], i) => i ? ctx.lineTo(a, b) : ctx.moveTo(a, b)); ctx.closePath();
  ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 3; ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath();
  for (let i = 0; i <= 10; i++){ const yy = 0.12 + 0.7 * i / 10; const px = x - w / 2 * shape.r(yy) + 9, py = y - h * yy; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
  ctx.stroke();

  // target line with a little Carter pointing at it
  const ty = y - h * target, tr = w / 2 * shape.r(target);
  ctx.strokeStyle = C.bad; ctx.lineWidth = 3; ctx.setLineDash([8, 6]);
  ctx.beginPath(); ctx.moveTo(x - tr - 14, ty); ctx.lineTo(x + tr + 14, ty); ctx.stroke(); ctx.setLineDash([]);
  const fx = x + tr + 32, fr = 16;
  if (face.complete && face.naturalWidth){
    ctx.save(); ctx.beginPath(); ctx.arc(fx, ty, fr, 0, Math.PI * 2); ctx.clip();
    const iw = face.naturalWidth, ih = face.naturalHeight;
    ctx.drawImage(face, iw * 0.15, ih * 0.15, iw * 0.7, iw * 0.7, fx - fr, ty - fr, fr * 2, fr * 2); ctx.restore();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(fx, ty, fr, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.fillStyle = C.bad; ctx.beginPath(); ctx.moveTo(fx - fr - 2, ty); ctx.lineTo(fx - fr - 10, ty - 6); ctx.lineTo(fx - fr - 10, ty + 6); ctx.closePath(); ctx.fill();

  // cup name under it
  ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.font = `700 13px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 3;
  ctx.fillText(`${shape.name} · ${drink.name}`, x, y + 10);
  ctx.shadowBlur = 0;
}

function drawBottle(){
  const L = bottle.len, bw = L * 0.34;
  ctx.save(); ctx.translate(bottle.x, bottle.y); ctx.rotate(tilt);
  // body (local: pivot at the middle of the body, neck points up = -y)
  const bodyTop = -L * 0.22, bodyBot = L * 0.42;
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-bw / 2, bodyBot); ctx.lineTo(-bw / 2, bodyTop);
  ctx.quadraticCurveTo(-bw / 2, -L * 0.42, -bw * 0.18, -L * 0.48);
  ctx.lineTo(-bw * 0.18, -L * 0.6); ctx.lineTo(bw * 0.18, -L * 0.6); ctx.lineTo(bw * 0.18, -L * 0.48);
  ctx.quadraticCurveTo(bw / 2, -L * 0.42, bw / 2, bodyTop); ctx.lineTo(bw / 2, bodyBot);
  ctx.quadraticCurveTo(0, bodyBot + 8, -bw / 2, bodyBot); ctx.closePath();
  ctx.fill();
  // drink inside the bottle
  ctx.save(); ctx.clip(); ctx.fillStyle = drink ? drink.c : '#5b2a12'; ctx.globalAlpha = 0.85;
  ctx.fillRect(-bw, bodyTop + (bodyBot - bodyTop) * 0.15, bw * 2, L); ctx.restore();
  ctx.stroke();
  // Carter label
  const lh = (bodyBot - bodyTop) * 0.55, ly = bodyTop + (bodyBot - bodyTop) * 0.25;
  ctx.fillStyle = '#fff'; ctx.fillRect(-bw / 2 + 2, ly, bw - 4, lh);
  if (face.complete && face.naturalWidth){
    const iw = face.naturalWidth, ih = face.naturalHeight, s = Math.min(bw - 10, lh - 14);
    ctx.save(); ctx.beginPath(); ctx.arc(0, ly + lh / 2 - 5, s / 2, 0, Math.PI * 2); ctx.clip();
    ctx.drawImage(face, iw * 0.15, ih * 0.15, iw * 0.7, iw * 0.7, -s / 2, ly + lh / 2 - 5 - s / 2, s, s); ctx.restore();
  }
  ctx.fillStyle = C.bad; ctx.font = `700 ${Math.max(7, bw * 0.16)}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillText('CARTER', 0, ly + lh - 1);
  // cap ring
  ctx.fillStyle = C.bad; ctx.fillRect(-bw * 0.2, -L * 0.6, bw * 0.4, 5);
  ctx.restore();
}

function drawStream(){
  if (state !== 'play') return;
  const m = mouth(), surf = cupBox.y - cupBox.h * level;
  const ft = fallTime();
  // the stream is drawn from the oldest drink still in the air to the newest
  let headAge = 0, tailAge = Infinity;
  for (const q of inflight){ headAge = Math.max(headAge, q.age); tailAge = Math.min(tailAge, q.age); }
  if (!inflight.length) return;
  const top = m.y + (surf - m.y) * Math.min(1, tailAge / ft), bot = m.y + (surf - m.y) * Math.min(1, headAge / ft);
  if (bot - top < 1) return;
  const wdt = 3 + 4 * Math.min(1, (tilt - 1.0) / 0.9);
  ctx.strokeStyle = drink.c; ctx.lineWidth = Math.max(2, wdt); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(m.x, top); ctx.lineTo(m.x + Math.sin(t * 20) * 0.8, bot); ctx.stroke();
  // splashes where it hits
  if (bot >= surf - 2 && Math.random() < 0.5) drops.push({ x: m.x, y: surf, vx: (Math.random() - .5) * 140, vy: -120 - Math.random() * 120, c: drink.c, small: true });
}

function shade(hex, k){
  const n = parseInt(hex.slice(1), 16), f = v => Math.max(0, Math.min(255, Math.round(v * (1 + k))));
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}

function draw(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (!shape) return;
  // table
  ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fillRect(0, cupBox.y, W, 4);
  drawStream();
  drawCup();
  for (const d of drops){ ctx.fillStyle = d.c; ctx.beginPath(); ctx.arc(d.x, d.y, d.small ? 2 : 3.5, 0, Math.PI * 2); ctx.fill(); }
  drawBottle();

  // first-cup hint
  if (state === 'play' && cupN === 0 && !used){
    ctx.fillStyle = '#fff'; ctx.font = `700 16px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 4;
    ctx.fillText(holding ? 'let go to stop' : 'hold anywhere to pour', W / 2, H * 0.2 + Math.sin(t * 4) * 3);
    ctx.shadowBlur = 0;
  }

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of pops){
    ctx.globalAlpha = Math.max(0, 1 - p.t / 1.4);
    const fs = 26; ctx.font = `700 ${fs}px ${FONT}`;
    const tw = ctx.measureText(p.txt).width + 24, y = cupBox.y - cupBox.h - 50 - p.t * 30;
    ctx.fillStyle = p.good ? C.good : C.bad;
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(W / 2 - tw / 2, y - fs * .8, tw, fs * 1.6, fs * .8) : ctx.rect(W / 2 - tw / 2, y - fs * .8, tw, fs * 1.6); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillText(p.txt, W / 2, y);
  }
  ctx.globalAlpha = 1;
  for (const c of confetti){ ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.r); ctx.fillStyle = c.c; ctx.fillRect(-4, -7, 8, 14); ctx.restore(); }
}

// test autopilot: pour, and let go when what's in the cup plus what's in the air reaches the line
function autoAim(){
  if (state !== 'play' || judged) return;
  if (!used && !holding) press();
  if (holding){
    // drink still in the air will land after we let go
    const air = inflight.reduce((s, q) => s + q.v, 0);
    if (levelFromVol(vol + air) >= target) release();
  }
}

let last = performance.now();
function frame(now){
  if (W !== innerWidth || H !== innerHeight) resize();
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (SIM){ const real = Math.min(2, (now - (frame.p || now)) / 1000); frame.p = now; for (let i = 0; i < real * 60; i++){ update(1 / 60); if (AUTO) autoAim(); } } else update(dt);
  draw();
  requestAnimationFrame(frame);
}

// ---------- input: hold to pour ----------
cv.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
addEventListener('pointerup', release);
addEventListener('pointercancel', release);
addEventListener('blur', release);
addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowDown'){
    e.preventDefault();
    if (state === 'play'){ if (!e.repeat) press(); } else if (!e.repeat) $('play').click();
  }
});
addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowDown') release(); });

// ---------- start ----------
let camAsked = false;
$('play').addEventListener('click', async () => {
  if (!camAsked){
    camAsked = true;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
      $('cam').srcObject = stream; document.body.classList.add('cam');
    } catch (e) {
      $('err').hidden = false; $('err').textContent = 'No camera, playing without it.';
    }
  }
  audio(); try { if (actx && actx.state === 'suspended') actx.resume(); } catch (e) {}
  reset();
  state = 'play';
  $('overlay').hidden = true;
});

resize();
shape = SHAPES[0]; drink = DRINKS[0]; buildVolume(shape); target = 0.7;
requestAnimationFrame(frame);
})();
</script>
</body>
